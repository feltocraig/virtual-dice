<!DOCTYPE html>
<html lang="en" class="no-js">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Interactive Couple's Dice Game - Fun for Adults!</title>
		<meta name="description" content="Enjoy an interactive 3D dice game for couples. Spice up your relationship with fun and excitement!" />
		<meta name="keywords" content="sex dice, couple's dice game, relationship dice, interactive dice, adult games" />
		<meta property="og:title" content="Interactive 3D Couple's Dice Game" />
		<meta property="og:description" content="Experience the thrill of our interactive 3D dice game for couples." />
		<meta property="og:image" content="https://virtualsexdice.com/img/sex-dice.png" />
		<meta property="og:url" content="https://virtualsexdice.com" />
		<meta name="robots" content="index, follow" /> 
		<link rel="canonical" href="https://virtualsexdice.com" />
		<link rel="shortcut icon" href="favicon.ico">
		<link rel="stylesheet" type="text/css" href="css/base.css" />
		<script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
		<script>document.documentElement.className="js";var supportsCssVars=function(){var e,t=document.createElement("style");return t.innerHTML="root: { --tmp-var: bold; }",document.head.appendChild(t),e=!!(window.CSS&&window.CSS.supports&&window.CSS.supports("font-weight","var(--tmp-var)")),t.parentNode.removeChild(t),e};supportsCssVars()||alert("Please view this demo in a modern browser that supports CSS Variables.");</script>
		<script>
			(function() {
				var isNightMode = localStorage.getItem('nightMode') === 'true';
				if (isNightMode) {
					document.documentElement.classList.add('night-mode');
				}
			})();
		</script>
	</head>
	<body>
		<main>
			<div class="content">
				<canvas id="canvas"></canvas>
				<div class="ui-controls">
					<span id="score-result"></span>
					<div class="button-container">
						<button id="roll-btn">Throw Dice</button>
						<button id="settings-btn" aria-label="Settings">
							<i class="fas fa-cog"></i>
						</button>
					</div>
				</div>
			</div>
		</main>
		<div id="settings-modal" class="modal">
			<div class="modal-content">
				<h2>Dice Settings</h2>
				
				<div class="settings-section">
					<h3>Type</h3>
					<div class="dice-selection">
						<div class="toggle-container vertical">
							<label class="toggle">
								<input type="checkbox" id="dice1-checkbox" checked>
								<span class="slider"></span>
								<span class="label">Standard Couple's Dice</span>
							</label>
							<label class="toggle">
								<input type="checkbox" id="dice5-checkbox">
								<span class="slider"></span>
								<span class="label">Woman-Specific Dice</span>
							</label>
							<label class="toggle">
								<input type="checkbox" id="dice6-checkbox">
								<span class="slider"></span>
								<span class="label">Man-Specific Dice</span>
							</label>
						</div>
					</div>
				</div>
				
				<div class="settings-section">
					<h3>Modifiers</h3>
					<div class="dice-selection">
						<label><input type="checkbox" id="dice2-checkbox" checked> Location Dice</label>
						<label><input type="checkbox" id="dice3-checkbox" checked> Descriptive Dice</label>
						<label><input type="checkbox" id="dice4-checkbox" checked> Timed Dice</label>
					</div>
				</div>
				
				<div class="settings-section">
					<h3>Display Settings</h3>
					<div class="night-mode-container">
						<span>Night Mode</span>
						<label class="night-mode-toggle" for="night-mode-toggle">
							<input type="checkbox" id="night-mode-toggle">
							<span class="toggle-slider">
								<i class="fas fa-sun"></i>
								<i class="fas fa-moon"></i>
							</span>
						</label>
					</div>
				</div>
				
				<button id="close-modal">Save Settings</button>
			</div>
		</div>
		<script async src="js/es-module-shims.min.js"></script>
		<script type="importmap">
		  {
			"imports": {
			  "three": "./js/three.module.min.js",
			  "cannon-es": "./js/cannon-es.js"
			}
		  }
		</script>
		<script src="./js/shake.js"></script>
		<script type="module" src="./js/main.js"></script>
		<!-- Add this just before the closing </body> tag -->
		<div id="mobile-shake-modal" class="modal">
			<div class="modal-content">
				<img src="img/shake-phone.svg" alt="Shake phone icon" class="shake-icon">
				<h2>Shake to Roll!</h2>
				<p>You can shake your phone to roll the dice.</p>
				<button id="got-it-btn">Got it!</button>
			</div>
		</div>
		<!-- Replace the existing timer-container div with this updated version -->
		<div class="timer-container">
			<div class="timer-progress"></div>
			<div class="timer-wrapper">
				<button id="start-timer-btn" class="timer-btn" aria-label="Start Timer">
					<i class="fas fa-play"></i>
				</button>
				<div class="timer-display">00:00</div>
				<button id="reset-timer-btn" class="timer-btn" disabled aria-label="Reset Timer">
					<i class="fas fa-redo"></i>
				</button>
				<button id="mute-btn" class="timer-btn" aria-label="Mute">
					<i class="fas fa-volume-up"></i>
				</button>
			</div>
		</div>
	</body>
</html>
