name: purge-minify-and-cache-bust
# Run on pushes to `main` branch
on:
  push:
    branches:
      - 'main'
permissions:
  contents: write
jobs:
  checkout-minify-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # Install CLI tools
      - uses: actions/setup-node@v3
        with:
          node-version: '16'
      - run: npm install -g webpack webpack-cli terser-webpack-plugin
      - run: npm install -g csso-cli
      - run: npm install -g html-minifier
      
      # Use webpack to bundle and tree shake JS files, excluding shake.js
      - name: Bundle and tree shake JS files
        run: |
          for js_file in ./js/*.js; do
            if [ "$(basename "$js_file")" != "shake.js" ]; then
              original_size=$(wc -c < "$js_file")
              webpack $js_file -o $js_file --mode production --optimization-minimize --devtool hidden-source-map
              new_size=$(wc -c < "$js_file")
              reduction=$((original_size - new_size))
              percent=$((reduction * 100 / original_size))
              echo "File $js_file reduced by $reduction bytes ($percent%)"
            fi
          done
      
      # Minify shake.js separately
      - name: Minify shake.js
        run: npx terser ./js/shake.js -o ./js/shake.js
      
      # Use CLI tools to minify CSS, overwriting existing files
      - run: for i in ./css/*.css; do csso $i -o $i; done
      
      # Rename JS files with content hash and update HTML
      - name: Rename JS files and update HTML
        run: |
          for js_file in ./js/*.js; do
            # Generate hash of file content
            hash=$(md5sum "$js_file" | awk '{ print $1 }')
            
            # Get the filename without path
            filename=$(basename "$js_file")
            
            # New filename with hash
            new_filename="${filename%.*}.${hash:0:8}.js"
            
            # Rename the file
            mv "$js_file" "./js/$new_filename"
            
            # Update HTML files to use new filename
            find . -name "*.html" -type f -exec sed -i "s|$filename|$new_filename|g" {} +
          done
      
      # Minify HTML files
      - run: for i in ./*.html; do html-minifier --remove-comments --minify-js true --minify-css true $i -o $i; done
      
      # Push changes to `gh-pages` branch
      - run: |
          git config user.name feltocraig
          git config user.email feltocraig@user.noreply.github.com
          git add .
          git commit -m 'Automated minify and cache-bust of ${{ github.sha }}'
          git push --force -u origin main:gh-pages
